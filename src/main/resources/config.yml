# GeyserSwap 設定
# /geyserswap コマンド (OP) からも変更でき、変更はこのファイルに保存されます。

# 機能そのものの ON/OFF
enabled: true

# 猶予 (ミリ秒)。ホットバーを切り替えてからこの時間以内に殴ると、
# 「切り替えと同じ tick に殴った」(= Java 版の属性スワップ) として扱う。
# 単位はミリ秒 (1 tick = 50ms、上限 3000)。0 にすると Java 版と同じく同 tick のときだけ成立。
# 外部から入るプレイヤーがいるなら 100 前後がおすすめ (回線の揺れとサーバーの tick 処理を吸収する)
grace-ms: 150

# 猶予内に殴ったとき、持ち替えでリセットされた攻撃のチャージ(クールダウン)を
# 持ち替える前から溜めていた分で計算する。殴った瞬間だけ効き、持ち替えただけでは何も変わらない。
# 属性の差し替えとは独立して効く (切り替え前が武器でなくても引き継ぐ)。
keep-attack-charge: true

# true: 統合版 (Geyser / Floodgate) プレイヤーだけに適用
# false: Java 版プレイヤーにも適用 (動作確認用)
bedrock-only: true

# 槍のリーチスワップ: 槍から持ち替えて猶予内に空振りしたら、槍のリーチで相手を探して
# 持ち替えた武器で殴る (統合版クライアントは 3 ブロックより遠い相手に攻撃を送らないため)
spear-reach: true
# 槍のリーチスワップの猶予 (ミリ秒)。槍から持ち替えてからこの時間以内の空振りを対象にする。
# 通常の猶予 (grace-ms) と長い方が使われる
spear-reach-grace-ms: 80

# 空中で持ち替えた場合は、着地するまで猶予を延長する (メイスの落下攻撃向け)
air-grace: true
# 空中延長の上限 (ミリ秒)
air-grace-max-ms: 3000

# スワップで殴った直後に元の武器へ持ち戻した切り替えはスワップにしない
# (しないと持ち戻した武器の次の一撃が «スワップ先の属性» で弱くなる)
ignore-swap-back: true

# 切り替え前の武器が今の武器より弱い (攻撃力が低い) ときは属性を差し替えない
# (例: メイス → 剣で、剣の一撃がメイスの攻撃力に下がるのを防ぐ)。槍のリーチスワップは例外
only-stronger: true

# 切り替え・攻撃・ダメージを本人のチャットとコンソールへ出す (成立しない理由も出る)
debug: false
